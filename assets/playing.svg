    <circle cx="140" cy="85" r="3.5" fill="#0f0c0a"/>
  </g>
  <image href="data:image/svg+xml;base64," x="20" y="25" width="120" height="120" clip-path="url(#round)" preserveAspectRatio="xMidYMid slice"/>
