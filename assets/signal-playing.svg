<svg xmlns="http://www.w3.org/2000/svg" width="495" height="150" viewBox="0 0 495 150" role="img" aria-label="NOW PLAYING: Midnight City by M83">
  <defs>
    <clipPath id="round"><rect x="18" y="18" width="114" height="114" rx="10"/></clipPath>
    <clipPath id="col"><rect x="150" y="0" width="327" height="150"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; }
